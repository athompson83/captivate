name: CI

# The verify job is the required pull-request gate. It classifies the diff,
# runs the repository-wide gate when code changed, and selects only the
# release-critical suites whose risk boundaries were touched.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: captivate-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck, lint, unit tests, build)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run-verify: ${{ steps.changes.outputs.run-verify }}
      run-rls: ${{ steps.changes.outputs.run-rls }}
      run-e2e: ${{ steps.changes.outputs.run-e2e }}
      run-smoke: ${{ steps.changes.outputs.run-smoke }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Select required checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run-verify=true" >> "$GITHUB_OUTPUT"
            echo "run-rls=true" >> "$GITHUB_OUTPUT"
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
            echo "run-smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Triple-dot isolates changes introduced by the PR. Disabling rename
          # detection reports both sides of a move so risk cannot disappear
          # when executable or schema files are moved into documentation paths.
          mapfile -t changed_files < <(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          run_verify=false
          run_rls=false
          run_e2e=false
          run_smoke=false

          for path in "${changed_files[@]}"; do
            case "$path" in
              *.md|LICENSE|LICENSE.*)
                ;;
              *)
                run_verify=true
                ;;
            esac

            case "$path" in
              .github/workflows/ci.yml|package.json|package-lock.json|supabase/*|scripts/check-migrations.mjs|src/proxy.ts|src/app/api/*|src/lib/data/*|src/lib/present/*|src/lib/supabase/*)
                run_rls=true
                ;;
            esac

            case "$path" in
              .github/workflows/ci.yml|package.json|package-lock.json|playwright.config.*|next.config.*|tsconfig.json|*.config.*|public/*|src/*|tests/e2e/*)
                run_e2e=true
                run_smoke=true
                ;;
            esac
          done

          echo "run-verify=$run_verify" >> "$GITHUB_OUTPUT"
          echo "run-rls=$run_rls" >> "$GITHUB_OUTPUT"
          echo "run-e2e=$run_e2e" >> "$GITHUB_OUTPUT"
          echo "run-smoke=$run_smoke" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.run-verify != 'true'
        run: echo "Documentation-only change; full verification is not required."
      - if: steps.changes.outputs.run-verify == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.changes.outputs.run-verify == 'true'
        run: npm ci
      - if: steps.changes.outputs.run-verify == 'true'
        run: npm run verify

  rls:
    name: RLS suite (all migrations, isolation + share-link assertions)
    needs: verify
    if: needs.verify.outputs.run-rls == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:rls
      - run: |
          createdb -h localhost -U postgres schemacheck
          psql -q -h localhost -U postgres -d schemacheck -v ON_ERROR_STOP=1 \
            -f supabase/tests/_supabase_stub.sql
          for f in supabase/migrations/*.sql; do
            psql -q -h localhost -U postgres -d schemacheck -v ON_ERROR_STOP=1 -f "$f"
          done
          SUPABASE_DB_URL="postgres://postgres:postgres@localhost:5432/schemacheck" \
            npm run migrations:check

  e2e-serverless:
    name: "Playwright (server-free: shader + lifecycle)"
    needs: verify
    if: needs.verify.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=shader --project=lifecycle

  smoke:
    name: "Playwright (production server: every route renders)"
    needs: verify
    if: needs.verify.outputs.run-smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=smoke
