name: CI

# The verify job is the stable pull-request gate. It classifies the diff, runs
# the repository-wide gate when code changed, and selects only the expensive
# release-critical suites whose risk boundaries were touched.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

# `contents: read` because no job here writes to the repository, comments on a
# pull request, or publishes anything. A job that one day does can raise its own
# permissions rather than every job inheriting the need.
#
# `persist-credentials: false` on each checkout because nothing talks to git
# after it, so the token has no reason to remain in .git/config where a later
# step — or a dependency's install script — could read it.
#
# The two actions are pinned by commit rather than by a major-version tag,
# which is a branch that moves: whoever controls it controls what runs here,
# beside `npm ci` and a database. The trailing comment is the readable version
# and the thing to bump.
#
# They are on v7, not the v4 this workflow used to float on. v4 runs on node20,
# which the runner is retiring; a pin freezes whatever it names, so pinning the
# old major would have turned a tag that at least drifted forward into a fixed
# point on a runtime with an end date.
permissions:
  contents: read

concurrency:
  group: captivate-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck, lint, unit tests, build)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run-verify: ${{ steps.changes.outputs.run-verify }}
      run-rls: ${{ steps.changes.outputs.run-rls }}
      run-e2e: ${{ steps.changes.outputs.run-e2e }}
      run-smoke: ${{ steps.changes.outputs.run-smoke }}
      run-authenticated: ${{ steps.changes.outputs.run-authenticated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Select required checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run-verify=true" >> "$GITHUB_OUTPUT"
            echo "run-rls=true" >> "$GITHUB_OUTPUT"
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
            echo "run-smoke=true" >> "$GITHUB_OUTPUT"
            echo "run-authenticated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Triple-dot isolates changes introduced by the PR. Disabling rename
          # detection reports both sides of a move so risk cannot disappear
          # when executable or schema files move into documentation paths.
          if ! changed_output=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA"); then
            echo "Unable to classify pull-request changes; refusing to skip validation." >&2
            exit 1
          fi
          mapfile -t changed_files <<< "$changed_output"
          run_verify=false
          run_rls=false
          run_e2e=false
          run_smoke=false
          run_authenticated=false

          for path in "${changed_files[@]}"; do
            case "$path" in
              *.md|LICENSE|LICENSE.*)
                ;;
              *)
                run_verify=true
                ;;
            esac

            case "$path" in
              .github/workflows/ci.yml|package.json|package-lock.json|supabase/*|scripts/check-migrations.mjs|scripts/seed-e2e-user.mjs|src/proxy.ts|src/app/api/*|src/app/auth/*|src/lib/ai/*|src/lib/auth/*|src/lib/billing/*|src/lib/data/*|src/lib/present/*|src/lib/supabase/*)
                run_rls=true
                ;;
            esac

            case "$path" in
              .github/workflows/ci.yml|package.json|package-lock.json|playwright.config.*|next.config.*|tsconfig.json|*.config.*|public/*|src/*|tests/e2e/*)
                run_e2e=true
                run_smoke=true
                ;;
            esac

            case "$path" in
              .github/workflows/ci.yml|package.json|package-lock.json|playwright.config.*|next.config.*|tsconfig.json|*.config.*|public/*|scripts/seed-e2e-user.mjs|src/*|supabase/*|tests/e2e/*)
                run_authenticated=true
                ;;
            esac
          done

          echo "run-verify=$run_verify" >> "$GITHUB_OUTPUT"
          echo "run-rls=$run_rls" >> "$GITHUB_OUTPUT"
          echo "run-e2e=$run_e2e" >> "$GITHUB_OUTPUT"
          echo "run-smoke=$run_smoke" >> "$GITHUB_OUTPUT"
          echo "run-authenticated=$run_authenticated" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.run-verify != 'true'
        run: echo "Documentation-only change; full verification is not required."
      - if: steps.changes.outputs.run-verify == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.changes.outputs.run-verify == 'true'
        run: npm ci
      - if: steps.changes.outputs.run-verify == 'true'
        run: npm run verify

  rls:
    name: RLS suite (all migrations, isolation + share-link assertions)
    needs: verify
    if: needs.verify.outputs.run-rls == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The major production runs (17.6, read from `server_version`), and the
        # one `supabase/config.toml` sets for a local stack. A policy exercised
        # against a different major from the one it will be enforced on is a
        # policy nobody has tested; the step below fails if these drift apart.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: The running major is the one this repository declares
        run: |
          declared=$(sed -n 's/^major_version *= *\([0-9]\+\).*/\1/p' supabase/config.toml)
          running=$(psql -h localhost -U postgres -tAc 'SHOW server_version_num')
          if [ -z "$declared" ]; then
            echo "supabase/config.toml declares no major_version" >&2
            exit 1
          fi
          if [ "$((running / 10000))" != "$declared" ]; then
            echo "config.toml declares Postgres $declared; this job is running $((running / 10000))" >&2
            exit 1
          fi
          echo "Postgres major $declared, as declared."
      - run: npm run test:rls
      # The assertions in supabase/schema_required.sql are what a deploy runs
      # against the real database. Running them here, against a scratch
      # database that has had every migration applied, is what keeps them from
      # drifting: an object the app needs that no migration creates fails here.
      - run: |
          createdb -h localhost -U postgres schemacheck
          psql -q -h localhost -U postgres -d schemacheck -v ON_ERROR_STOP=1 \
            -f supabase/tests/_supabase_stub.sql
          for f in supabase/migrations/*.sql; do
            psql -q -h localhost -U postgres -d schemacheck -v ON_ERROR_STOP=1 -f "$f"
          done
          SUPABASE_DB_URL="postgres://postgres:postgres@localhost:5432/schemacheck" \
            npm run migrations:check

  e2e-serverless:
    name: "Playwright (server-free: shader + lifecycle)"
    needs: verify
    if: needs.verify.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The "authenticated" project needs live credentials — deliberately out
      # of scope here. shader/lifecycle need no server at all: see
      # playwright.config.ts's SERVERLESS set. "smoke" needs a server but no
      # account, and has its own job below.
      - run: npx playwright test --project=shader --project=lifecycle

  smoke:
    name: "Playwright (production server: every route renders)"
    needs: verify
    if: needs.verify.outputs.run-smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The one suite that exercises a real React Server Components runtime.
    # `next build` succeeds on a server module that imports a `"use client"`
    # helper; the route then answers 500 for every visitor. Nothing else in
    # this workflow can see that, because nothing else runs the server.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=smoke

  authenticated:
    name: "Playwright (local Supabase: the signed-in journeys)"
    needs: verify
    if: needs.verify.outputs.run-authenticated == 'true'
    runs-on: ubuntu-latest
    # Longer than the others on purpose: this one pulls and starts the whole
    # Supabase stack before it can build anything.
    timeout-minutes: 30
    # The twenty-eight journeys in journey.spec.ts — authoring, presenting, the
    # camera, the narrative map — skip themselves without an account, so until
    # now they ran nowhere. Production has email confirmation on and a
    # synthetic hosted sign-up would need a mailbox nobody owns, which is what
    # made this look like it needed a credential from the owner. It does not:
    # the runner has Docker, so the stack can be stood up here, seeded, and
    # thrown away with the job. Nothing touches production.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Pinned, not `latest`. The CLI decides how config.toml is read and
          # what `supabase start` brings up, so a release could change this job
          # with no commit here — which is exactly how the major_version
          # rejection arrived. Bump it deliberately.
          version: 2.116.0
      # `supabase start` applies supabase/migrations in name order, so this is
      # also the only place the app is exercised against a database built the
      # way a real one is.
      - run: supabase start

      # The local stack mints its own keys. Reading them back beats hardcoding
      # the well-known demo values, which change between CLI versions and would
      # fail as a confusing auth error rather than as a missing variable.
      - name: Export the local stack's credentials
        # The stack mints its own keys. Reading them back beats hardcoding the
        # well-known demo values, which differ between CLI versions and would
        # surface as a confusing auth failure rather than a missing variable.
        # Masked because they reach the log otherwise; they belong to a
        # container that dies with the job, but an unmasked key in a public log
        # teaches the wrong habit.
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          : "${ANON_KEY:?supabase status did not report ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status did not report SERVICE_ROLE_KEY}"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Seed the synthetic account
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          CAPTIVATE_E2E_EMAIL: e2e@captivate.test
          CAPTIVATE_E2E_PASSWORD: ${{ github.run_id }}-e2e-local
        run: node scripts/seed-e2e-user.mjs

      - name: Build against the local stack
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
        run: npm run build

      - name: Run the signed-in journeys
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          CAPTIVATE_E2E_EMAIL: e2e@captivate.test
          CAPTIVATE_E2E_PASSWORD: ${{ github.run_id }}-e2e-local
        run: npx playwright test --project=authenticated

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authenticated-playwright-report
          path: playwright-report/
          retention-days: 3
